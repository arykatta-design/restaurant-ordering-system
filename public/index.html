<html>

<head>
    <title>Truffles Restaurant</title>
    <link rel="stylesheet" href="style.css">

    <style>

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .status-btn{
            background:#1976d2;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="top-bar">

        <div>
    <h1>🍴 Truffles Restaurant</h1>
    <p>Scan • Order • Enjoy</p>
</div>

        <button
            class="status-btn"
            onclick="checkStatus()">

            📋 Check Current Order Status

        </button>

    </div>

    <div id="menu"></div>

    <div id="cart-section">

    <h2>🛒 Your Order</h2>

    <div id="cart"></div>

    <h3 id="total">Total: ₹0</h3>

    <button onclick="placeOrder()">
        Place Order
    </button>

</div>

<div id="floating-cart">
    🛒 Cart (0) • ₹0
</div>

    <script src="script.js"></script>

</body>

</html>
