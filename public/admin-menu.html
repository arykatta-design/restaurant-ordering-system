<!DOCTYPE html>

<html>
<head>
    <title>Menu Management</title>

```
<style>
    body{
        font-family: Arial, sans-serif;
        background:#f5f5f5;
        padding:20px;
    }

    h1{
        text-align:center;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        margin-bottom:20px;
    }

    input{
        width:100%;
        padding:10px;
        margin:5px 0;
    }

    button{
        padding:10px 15px;
        cursor:pointer;
        margin-top:10px;
    }

    .menu-item{
        background:white;
        padding:15px;
        margin-bottom:10px;
        border-radius:10px;
    }

    img{
        width:120px;
        border-radius:10px;
    }

    .actions button{
        margin-right:10px;
    }
</style>
```

</head>

<body>

<h1>Restaurant Menu Manager</h1>

<div class="card">

```
<h2>Add Menu Item</h2>

<input id="name" placeholder="Item Name">

<input id="price" type="number" placeholder="Price">

<input
    type="file"
    id="image"
    accept="image/*"
>

<button onclick="addItem()">
    Add Item
</button>
```

</div>

<div id="menuList"></div>

<script>

async function loadMenu(){

    const res = await fetch("/admin-menu")

    const menu = await res.json()

    const container = document.getElementById("menuList")

    container.innerHTML = ""

    menu.forEach(item => {

        container.innerHTML += `
            <div class="menu-item">

                <img src="${item.image}">

                <h3>${item.name}</h3>

                <p>₹${item.price}</p>

<p>
    ${item.available
        ? "🟢 In Stock"
        : "🔴 Out Of Stock"}
</p>

                <div class="actions">

                    <button onclick="editItem('${item._id}')">
                        Edit
                    </button>

                    <button onclick="deleteItem('${item._id}')">
    Delete
</button>

<button onclick="toggleStock('${item._id}')">
    ${item.available
        ? "Mark Out Of Stock"
        : "Mark In Stock"}
</button>

                </div>

            </div>
        `
    })
}

async function addItem(){

    const formData = new FormData()

    formData.append(
        "name",
        document.getElementById("name").value
    )

    formData.append(
        "price",
        document.getElementById("price").value
    )

    formData.append(
        "image",
        document.getElementById("image").files[0]
    )

    await fetch("/menu",{
        method:"POST",
        body:formData
    })

    document.getElementById("name").value = ""
    document.getElementById("price").value = ""
    document.getElementById("image").value = ""

    loadMenu()
}

async function deleteItem(id){

    await fetch("/menu/" + id,{
        method:"DELETE"
    })

    loadMenu()
}

async function toggleStock(id){

    await fetch("/toggle-stock/" + id,{
        method:"POST"
    })

    loadMenu()
}

async function editItem(id){

    const name = prompt("New item name")

    const price = prompt("New price")

    const image = prompt(
        "Image URL (leave blank to keep existing image)"
    )

    await fetch("/menu/" + id,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name,
            price:Number(price),
            image
        })
    })

    loadMenu()
}

loadMenu()

</script>

</body>
</html>
