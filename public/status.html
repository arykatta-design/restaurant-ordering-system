<html>

<head>

<title>Order Status</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border-radius:20px;
    color:white;
    font-weight:bold;
}

.preparing{
    background:orange;
}

.ready{
    background:green;
}

.delivered{
    background:#1976d2;
}

ul{
    margin-top:15px;
    padding-left:20px;
}

li{
    margin-bottom:8px;
}

button{
    width:100%;
    background:#16a34a;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="header">

<h1>🍽 Order Status</h1>

<h2 id="table"></h2>

</div>

<div id="orders"></div>

<button onclick="goToMenu()">
🍴 Order More Food
</button>

<script>

const params =
    new URLSearchParams(window.location.search)

const table =
    params.get("table")

document.getElementById("table").innerText =
    "Table " + table

function loadStatus(){

    fetch("/order-status/" + table)
    .then(res => res.json())
    .then(data => {

        if(data.length === 0){

            document.getElementById("orders").innerHTML =
                "<h2>No active orders.</h2>"

            return
        }

        let html = ""

        data.reverse()

        data.forEach(order => {

            let badgeClass = "preparing"

            if(order.status === "Ready"){
                badgeClass = "ready"
            }

            if(order.status === "Delivered"){
                badgeClass = "delivered"
            }

            html += `

                <div class="card">

                    <h2>Order #${order._id}</h2>

                    <br>

                    <span class="badge ${badgeClass}">
                        ${order.status}
                    </span>

                    <p style="margin-top:15px;">
                        ⏰ ${order.time}
                    </p>

                    <ul>

                        ${order.items.map(item =>

                            `<li>
                                ${item.name}
                                x${item.quantity}
                            </li>`

                        ).join("")}

                    </ul>

                    <h3>
                        Total ₹${order.total}
                    </h3>

                </div>

            `
        })

        document.getElementById("orders").innerHTML =
            html

    })
}

function goToMenu(){

    window.location.href =
        "/?table=" + table
}

loadStatus()

setInterval(loadStatus,3000)

</script>

</body>

</html>
